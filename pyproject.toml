[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vortex-runner"
version = "0.2.0"
description = "SSH-based executor for archer-vortex with MCP server for Claude Code"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pyyaml>=6.0",
    "mcp>=1.0.0",
]

[project.scripts]
vortex-run = "vortex_runner.cli:main"
intern = "vortex_runner.cli:main"
intern-mcp = "vortex_runner.mcp_server:run_server"

[tool.setuptools.packages.find]
where = ["."]
